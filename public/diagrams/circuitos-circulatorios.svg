    <text x="169" y="214" font-size="21" font-weight="650">Átrio direito</text>
    <text x="169" y="271" font-size="21" font-weight="650">Ventrículo direito</text>
    <text x="551" y="214" font-size="21" font-weight="650">Átrio esquerdo</text>
    <text x="551" y="271" font-size="21" font-weight="650">Ventrículo esquerdo</text>
    <text x="360" y="242" font-size="22" font-weight="650">Coração</text>
    <text x="360" y="366" font-size="23" font-weight="700">Capilares dos tecidos</text>
    <text x="360" y="395" font-size="20">O₂ vai aos tecidos</text>
