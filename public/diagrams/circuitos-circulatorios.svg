<svg xmlns="http://www.w3.org/2000/svg" width="720" height="444" viewBox="0 0 720 444"
  role="img" aria-labelledby="titulo descricao" xml:lang="pt-BR">
  <title id="titulo">Circuitos pulmonar e sistêmico</title>
  <desc id="descricao">O ventrículo direito bombeia sangue pelas artérias pulmonares até os capilares dos pulmões. O sangue retorna pelas veias pulmonares ao átrio esquerdo e passa ao ventrículo esquerdo. A aorta e as artérias sistêmicas levam sangue aos capilares dos tecidos. As veias sistêmicas levam sangue de volta ao átrio direito, de onde passa ao ventrículo direito.</desc>
  <metadata>Esquema original do FisioAcessível. Licença pública de reutilização não definida.</metadata>
